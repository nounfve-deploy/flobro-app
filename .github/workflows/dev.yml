name: dev

on:
  workflow_dispatch:

# Never build the same tag twice in parallel: concurrent runs interleave
# their asset uploads into one draft, leaving latest.json with signatures
# that do not match the uploaded binaries (the v1.2.0 updater breakage).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - platform: ubuntu-latest
          - platform: windows-latest

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Install Ubuntu-specific packages
        if: startsWith(matrix.platform, 'ubuntu')
        run: >
          sudo apt-get update &&
          sudo apt-get install -y 
          libwebkit2gtk-4.1-dev 
          build-essential 
          curl 
          wget 
          file 
          libxdo-dev 
          libssl-dev 
          libayatana-appindicator3-dev 
          librsvg2-dev

      - uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Install and cache Cargo executable
        uses: taiki-e/cache-cargo-install-action@v3
        with:
          tool: tauri-cli

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      # macOS code signing + notarization (only used on the macos runner).
      # Set these repository secrets; see SETUP-GUIDE.md for how to create them:
      #   APPLE_CERTIFICATE            base64 of the Developer ID Application .p12
      #   APPLE_CERTIFICATE_PASSWORD   password of that .p12
      #   APPLE_SIGNING_IDENTITY       e.g. "Developer ID Application: Your Name (TEAMID)"
      #   APPLE_ID                     your Apple ID email
      #   APPLE_PASSWORD               app-specific password from appleid.apple.com
      #   APPLE_TEAM_ID                your 10-character team id
      # Missing secrets arrive as empty strings; the Tauri bundler treats an empty
      # APPLE_CERTIFICATE as "present" and fails. Only export the ones that are set,
      # so unsigned builds work before the secrets exist and signing starts
      # automatically once they do.
      - name: Export Apple signing env when secrets are set
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value="${!name}"
            if [ -n "$value" ]; then
              {
                echo "${name}<<__FLOBRO_EOF__"
                echo "$value"
                echo "__FLOBRO_EOF__"
              } >> "$GITHUB_ENV"
            fi
          done
      - name: Build
        run: |
          cargo tauri build --no-sign
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dev-build-${{ matrix.platform }}
          path: |
            src-tauri/target/release/flobro
            src-tauri/target/release/flobro.exe
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
      - name: Zip All Artifacts
        run: |
          for dir in */;            
          do (cd "${dir}" && zip -r "../${dir%/}.zip" ".");
          done
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          name: dev-${{ github.sha }}
          files: ./*.zip
          draft: true
          prerelease: true
